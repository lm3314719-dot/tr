<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DevForge Pro Standalone</title>
  <style>
    :root { --bg:#0b1020; --panel:#151b30; --text:#ecf1ff; --primary:#6c5ce7; --ok:#00b894; --warn:#fdcb6e; --danger:#e17055; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Inter,system-ui,sans-serif; color:var(--text); background:linear-gradient(135deg,#0a0a1a,#1a1a2e); }
    header { display:flex; justify-content:space-between; align-items:center; padding:12px 16px; border-bottom:1px solid #2d355e; position:sticky; top:0; background:rgba(10,10,26,.92); backdrop-filter: blur(8px); }
    .logo { font-weight:800; font-size:1.2rem; background:linear-gradient(90deg,#6c5ce7,#a29bfe,#00b894); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .layout { display:grid; grid-template-columns:330px 1fr; gap:14px; padding:14px; min-height:calc(100vh - 58px); }
    .panel { background:var(--panel); border:1px solid #2d355e; border-radius:12px; padding:12px; }
    h2,h3 { margin:0 0 10px; }
    label { display:block; font-size:12px; margin-bottom:8px; }
    input,textarea,select { width:100%; margin-top:4px; border:1px solid #394574; border-radius:8px; background:#0f1529; color:var(--text); padding:10px; }
    textarea { min-height:110px; resize:vertical; }
    .row { display:flex; gap:8px; flex-wrap:wrap; }
    button { border:0; border-radius:8px; padding:9px 12px; color:#fff; cursor:pointer; background:linear-gradient(135deg,var(--primary),#8d9aff); }
    .btn-ok { background:var(--ok); }
    .btn-warn { background:var(--warn); color:#1d1d1d; }
    .btn-danger { background:var(--danger); }
    pre { white-space:pre-wrap; background:#090e1f; border:1px solid #273058; border-radius:8px; padding:10px; min-height:120px; }
    .agent-card { border:1px solid #2d355e; border-radius:8px; padding:8px; margin-bottom:8px; }
    .chat { display:flex; flex-direction:column; gap:8px; max-height:240px; overflow:auto; padding:8px; background:#090e1f; border:1px solid #273058; border-radius:8px; }
    .msg { padding:8px; border-radius:8px; }
    .user { background:rgba(108,92,231,.25); margin-left:20px; }
    .agent { background:rgba(255,255,255,.06); margin-right:20px; }
    .muted { opacity:.8; font-size:12px; }
    @media(max-width:980px){ .layout{grid-template-columns:1fr;} }
  </style>
</head>
<body>
<header>
  <div class="logo">⚡ DevForge Pro — Standalone</div>
  <div class="row">
    <button onclick="runWorkflow()">🚀 Run Workflow</button>
    <button class="btn-ok" onclick="saveProject()">💾 Save</button>
    <button class="btn-warn" onclick="downloadFile()">📦 Download .html</button>
    <button class="btn-danger" onclick="clearAll()">🗑️ Clear</button>
  </div>
</header>
<div class="layout">
  <aside class="panel">
    <h2>Configurazione</h2>
    <label>Goal<input id="goal" placeholder="Crea piattaforma SAAS con test e CI"></label>
    <label>Max iterazioni<input id="maxIterations" type="number" min="1" max="999" value="20"></label>
    <label>Project name<input id="projectName" value="devforge-project"></label>
    <p class="muted">Le API key sono opzionali e NON hardcoded.</p>

    <h3>Agenti</h3>
    <div id="agents"></div>

    <h3>Import / Export JSON</h3>
    <div class="row">
      <button onclick="exportState()">Export state</button>
      <button onclick="document.getElementById('jsonFile').click()">Import state</button>
      <input id="jsonFile" type="file" accept="application/json" style="display:none" onchange="importState(event)">
    </div>
  </aside>

  <main class="panel">
    <h2>Editor + Chat multi-agent</h2>
    <label>Prompt<textarea id="prompt" placeholder="Chiedi agli agenti di pianificare, codare e debuggare..."></textarea></label>
    <div class="row">
      <select id="agentSelect"></select>
      <button onclick="sendSingle()">Invia a agente</button>
      <button onclick="collaborate()">🤝 Collaborate 3 agenti</button>
    </div>
    <div id="chat" class="chat"></div>

    <h3>Codice / Output</h3>
    <textarea id="code" style="min-height:190px" placeholder="Qui vedrai il codice generato"></textarea>
    <pre id="output"></pre>
  </main>
</div>

<script>
const state = {
  version: '3.0.0-standalone',
  memory: { tasks: [], iterations: [], notes: [] },
  agents: [
    { id:'planner', name:'GLM Planner', model:'z-ai/glm-5.1', apiKey:'', active:true, role:'planning' },
    { id:'coder', name:'DeepSeek Coder', model:'deepseek-ai/deepseek-v4-pro', apiKey:'', active:true, role:'code_generation' },
    { id:'debugger', name:'MiniMax Debugger', model:'minimaxai/minimax-m2.7', apiKey:'', active:true, role:'debugging' }
  ]
};

const $ = (id) => document.getElementById(id);
const out = (v) => $('output').textContent = typeof v === 'string' ? v : JSON.stringify(v,null,2);
const pushMsg = (who, text, cls='agent') => {
  const el = document.createElement('div');
  el.className = `msg ${cls}`;
  el.innerHTML = `<strong>${who}:</strong> ${text}`;
  $('chat').appendChild(el);
  $('chat').scrollTop = $('chat').scrollHeight;
};

function renderAgents() {
  const root = $('agents'); const select = $('agentSelect');
  root.innerHTML = ''; select.innerHTML = '';
  state.agents.forEach((a, idx) => {
    const c = document.createElement('div'); c.className = 'agent-card';
    c.innerHTML = `
      <strong>${a.name}</strong>
      <label>Model<input value="${a.model}" onchange="updateAgent(${idx},'model',this.value)"></label>
      <label>API Key (opzionale)<input type="password" placeholder="incolla qui" onchange="updateAgent(${idx},'apiKey',this.value)"></label>
      <label><input type="checkbox" ${a.active?'checked':''} onchange="updateAgent(${idx},'active',this.checked)"> Active</label>
      <div class="muted">Role: ${a.role}</div>`;
    root.appendChild(c);

    const op = document.createElement('option');
    op.value = idx; op.textContent = `${a.name} (${a.model})`;
    select.appendChild(op);
  });
}

function updateAgent(i,k,v){ state.agents[i][k]=v; persist(); }

function offlineAgentReply(agent, prompt) {
  if (agent.role === 'planning') return `Piano: 1) Analisi goal 2) Architettura 3) Implementazione 4) Test 5) Release. Prompt: ${prompt.slice(0,140)}`;
  if (agent.role === 'code_generation') return `// Codice generato da ${agent.name}\nfunction main(){\n  console.log('Task: ${prompt.slice(0,80).replace(/'/g,'')}');\n}\nmain();`;
  return `Checklist debug: input validation, error handling, tests unit/integration, performance check.`;
}

async function maybeCallRemote(agent, prompt){
  if (!agent.apiKey) return `[OFFLINE] ${offlineAgentReply(agent,prompt)}`;
  try {
    const res = await fetch('https://integrate.api.nvidia.com/v1/chat/completions', {
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':`Bearer ${agent.apiKey}`},
      body: JSON.stringify({
        model: agent.model,
        messages:[{role:'system',content:`You are ${agent.name}, role=${agent.role}`},{role:'user',content:prompt}],
        max_tokens:1200, temperature:0.7, top_p:0.95
      })
    });
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    return data.choices?.[0]?.message?.content || '[empty response]';
  } catch(e) {
    return `[FALLBACK OFFLINE: ${e.message}] ${offlineAgentReply(agent,prompt)}`;
  }
}

async function sendSingle(){
  const prompt = $('prompt').value.trim(); if(!prompt) return;
  const agent = state.agents[Number($('agentSelect').value)];
  pushMsg('You', prompt, 'user');
  const reply = await maybeCallRemote(agent, prompt);
  pushMsg(agent.name, reply);
  if (reply.includes('function') || reply.includes('class') || reply.includes('```')) $('code').value = reply;
  state.memory.notes.push(`Single chat with ${agent.name}`);
  persist();
}

async function collaborate(){
  const prompt = $('prompt').value.trim() || $('goal').value.trim();
  if(!prompt) return alert('Inserisci un prompt o goal.');
  pushMsg('System','Collaborazione multi-agent avviata...');
  const active = state.agents.filter(a=>a.active);
  const replies = [];
  for (const a of active){
    const rep = await maybeCallRemote(a, prompt);
    replies.push({agent:a.name, content:rep});
    pushMsg(a.name, rep);
  }
  $('code').value = replies.map(r=>`// ${r.agent}\n${r.content}`).join('\n\n');
  state.memory.notes.push(`Collaborazione su prompt: ${prompt.slice(0,120)}`);
  persist();
}

function runWorkflow(){
  const goal = $('goal').value.trim();
  const maxIt = Number($('maxIterations').value || 20);
  if(!goal) return alert('Inserisci un goal');

  state.memory.tasks = [
    {id:'task-1', description:`Analizzare goal: ${goal}`, status:'completed'},
    {id:'task-2', description:'Creare struttura progetto', status:'completed'},
    {id:'task-3', description:'Implementare test e pipeline', status:'completed'},
    {id:'task-4', description:'Verificare bug e qualità', status:'completed'},
    {id:'cfdml-validate', description:'Validare pipeline CFD/ML', status:'completed'}
  ];
  state.memory.iterations = Array.from({length:Math.min(maxIt,5)}).map((_,i)=>(
    {iteration:i+1, summary:`Iterazione ${i+1} completata`, errors:[]}
  ));
  state.memory.notes.push(`Workflow run @ ${new Date().toISOString()}`);
  persist();

  out({status:'ok', goal, memory:state.memory, tips:'Usa Collaborate per far lavorare planner/coder/debugger.'});
}

function persist(){ localStorage.setItem('devforge_state', JSON.stringify(state)); }
function restore(){
  const raw = localStorage.getItem('devforge_state');
  if(!raw) return;
  try {
    const saved = JSON.parse(raw);
    Object.assign(state, saved);
    if(saved.agents?.length===3) state.agents = saved.agents;
    $('goal').value = saved.lastGoal || $('goal').value;
  } catch {}
}

function saveProject(){
  state.lastGoal = $('goal').value;
  state.lastCode = $('code').value;
  persist();
  pushMsg('System','Stato salvato in localStorage.');
}

function exportState(){
  const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${$('projectName').value || 'devforge'}-state.json`;
  a.click();
}

function importState(event){
  const file = event.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      Object.assign(state, parsed);
      renderAgents();
      out('State importato con successo.');
      persist();
    } catch { out('Errore import JSON'); }
  };
  reader.readAsText(file);
}

function downloadFile(){
  const blob = new Blob([document.documentElement.outerHTML], {type:'text/html'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'devforge_pro_standalone.html';
  a.click();
}

function clearAll(){
  $('prompt').value=''; $('code').value=''; $('output').textContent=''; $('chat').innerHTML='';
  state.memory = { tasks:[], iterations:[], notes:[] };
  persist();
}

window.addEventListener('DOMContentLoaded', ()=>{
  restore();
  renderAgents();
  pushMsg('System','DevForge Pro Standalone pronto.');
});
</script>
</body>
</html>
